name: Publish plugin SDK

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: plugin-sdk-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: node scripts/check-version.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: npm test
        working-directory: packages/plugin-sdk
      - run: npm install --global npm@11
      - name: Publish SDK if this version is not already public
        shell: bash
        run: |
          node -e 'fetch("https://registry.npmjs.org/" + encodeURIComponent("@diegolopez02081/novaterm-plugin-sdk") + "/" + JSON.parse(require("fs").readFileSync("package.json")).version).then(r => { if (r.ok) process.exit(0); if (r.status === 404) process.exit(10); throw Error("Registry lookup failed: " + r.status) }).catch(e => { console.error(e); process.exit(1) })' && exit 0
          status=$?
          if [ "$status" -ne 10 ]; then exit "$status"; fi
          npm publish --access public
        working-directory: packages/plugin-sdk
