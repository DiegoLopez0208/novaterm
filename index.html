<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaTerm</title>
    <!-- El splash vive en el HTML y no en React a proposito: se pinta apenas el
         webview parsea el documento, sin esperar a que cargue ni se ejecute el
         bundle. Los estilos van inline por lo mismo. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d0f18;
        animation: splash-entrada 0.18s ease-out;
      }
      /* La salida la dispara React cuando ya tiene algo que dibujar debajo. */
      #splash.se-va {
        opacity: 0;
        transition: opacity 0.22s ease-in;
        pointer-events: none;
      }
      #splash img {
        width: 76px;
        height: 76px;
      }
      @keyframes splash-entrada {
        from {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash">
      <img src="/favicon.svg" width="76" height="76" alt="" />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
